name: Lesson 5 DAST

on:
  push:
    branches:
      - lesson-5
jobs:
  security_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    name: Execute the PyCharm security test
    steps:
      - uses: actions/checkout@v4
      - name: PyCharm Python Security Scanner
        uses: tonybaloney/pycharm-security@1.25.1
  build_and_test:
    needs: [security_test]
    runs-on: ubuntu-latest
  function_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
     - uses: actions/checkout@v4
     - run: npm install
     - name: Run functional tests
       run: npm test -- --coverage --watchAll=false
  deploy:
    needs: [function_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm install && npm run build (commented out to save learner time)
      - name: Generate deployment package
        run: zip -r deploy.zip build Dockerfile
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment
